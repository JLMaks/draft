<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Création de Partie</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f2f2f2;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .game-container {
      background-color: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
      text-align: center;
      width: 300px;
    }

    h1 {
      margin-bottom: 25px;
      color: #333;
    }

    p {
      font-size: 18px;
      margin: 15px 0;
      color: #444;
    }

    #startGameBtn {
      margin-top: 25px;
      padding: 10px 20px;
      font-size: 16px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    #startGameBtn:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <div class="game-container">
    <h1>Création de Partie</h1>

    <!-- Affichage du nombre de joueurs dans la partie -->
    <p id="playerCount">Joueurs dans la partie : 1</p> <!-- On va remplacer ce texte avec JS -->

    <!-- Affichage du code de la partie -->
    <p>Code de la partie : <span id="gameCode"></span></p> <!-- Code récupéré et affiché ici -->

    <!-- Bouton pour démarrer la partie -->
    <button id="startGameBtn">Démarrer la Partie</button>
  </div>

  <script>
    window.onload = function () {
      // Récupérer le pseudo du créateur
      const creator = localStorage.getItem("creator");
      const joueurs = JSON.parse(localStorage.getItem("joueurs")) || [];

      // Mettre à jour le texte avec le nombre de joueurs
      let playersCount = 1 + joueurs.length; // 1 pour le créateur + le nombre de joueurs qui rejoignent
      document.getElementById("playerCount").textContent = `Joueurs dans la partie : ${playersCount}`;

      // Afficher le code de la partie
      const gameCode = localStorage.getItem("gameCode");
      document.getElementById("gameCode").textContent = gameCode;
    };
  </script>
</body>
</html>
