  <!DOCTYPE html>
  <html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="form-section">
      <h1>Inscription</h1>
      <input type="text" id="pseudo" placeholder="Pseudo">
      <input type="text" id="nomRP" placeholder="Nom RP">
      <button id="validerBtn">Valider</button>
    </div>

    <div class="menu-section" style="display:none;">
      <h1>Menu Principal</h1>
      <button id="creerBtn">Créer une Partie</button>
      <button id="rejoindreBtn">Rejoindre une Partie</button>
    </div>

    <!-- Page pour rejoindre une partie -->
    <div class="join-game-section" style="display:none;">
      <h1>Rejoindre une Partie</h1>
      <input type="text" id="gameCodeInput" placeholder="Entrez le code de la partie">
      <button id="joinGameBtn">Rejoindre</button>
      <p id="error-message" style="color: red;"></p>
      <p id="success-message" style="color: green;"></p>
    </div>

    <script src="script.js"></script>
  </body>
  </html>
